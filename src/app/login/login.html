<div class="loginContent">
    <div class="content">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="on">
            <h6 class="title">Log in</h6>
            <div class="field">
                <label for="email">Telegram username</label>
                <input formControlName="username" id="email" type="text" value="" placeholder="Provide your login" required=>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input formControlName="password" id="password" type="text" value="" placeholder="Provide you password" required>
            </div>
            <button type=""submit>Log in</button>
        </form>
        <img class="loginHero" src="/assets/images/loginHero.png" alt="Login Hero" />
    </div>
</div>
