<div class="profile-card">
    <div class="avatar-name">
        <img [src]="profile().avatarUrl | imgUrl" alt="avatar" class="avatar">

        <div class="name">
            <h6>{{ profile().firstName }} {{ profile().lastName }}</h6>
            <span class="subtitle">{{ profile().username }}</span>
        </div>
    </div>

    <div class="description">{{ profile().description }}</div>

    <ul class="profile-tags">
        @for(tag of profile().stack; track profile().stack) {
        <li class="skill-tag">{{tag}}</li>
        }
    </ul>

    <button>Subsribe</button>
</div>
